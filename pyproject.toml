[tool.poetry]
name = "brickllm"
version = "1.3.0"
description = "Library for generating RDF files following BrickSchema ontology using LLM"
authors = ["Marco Perini <marco.perini@eurac.edu>", "Daniele Antonucci <daniele.antonucci@eurac.edu>"]
license = "BSD-3-Clause"
readme = "README.md"
homepage = "https://brickllm.com/"
repository = "https://github.com/EURAC-EEBgroup/brickllm-lib"
documentation = "https://brickllm.com/docs"
keywords = [
    "brickllm",
    "brickschema",
    "rdf",
    "ontologies",
    "knowledge graph",
    "semantic web",
    "ai",
    "artificial intelligence",
    "gpt",
    "machine learning",
    "natural language processing",
    "nlp",
    "openai",
    "building automation",
    "iot",
    "graph",
    "ontology",
]

classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

packages = [{include = "brickllm"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
rdflib = "^7.6.0"
python-dotenv = "^1.0.1"
langchain = "^1.2.10"
langgraph = "^1.0.10"
langchain-openai = "^1.1.10"
setuptools = "^82.0.0"
pyshacl = "^0.31.0"
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-sugar = "*"
pytest-cov = "*"
black = "*"
mypy = "*"
ruff = "*"
isort = "*"
pre-commit = "*"
types-setuptools = "^75.1.0.20240917"
mkdocs = "^1.5"
mkdocs-material = "^9.2"
mkdocstrings-python = "^1.1"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "C"]
ignore = ["E203", "E501"]  # Ignore conflicts with Black

[tool.mypy]
python_version = "3.9"
strict = true
disallow_untyped_calls = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
